name: CI
on:
  push: &triggers
    branches: [main, dev]
    paths:
    - 'recipe.yaml'
    - '*.patch'
    - '.github/workflows/ci.yml'
  pull_request: *triggers
  workflow_dispatch:
defaults: {run: {shell: 'bash -el {0}'}}
jobs:
  build:
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 100M
    steps:
    - uses: actions/checkout@v7
    - name: Cache ccache
      uses: actions/cache@v6
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ runner.os }}-${{ hashFiles('recipe.yaml', 'patches/**') }}
        restore-keys: ccache-${{ runner.os }}-
    - name: config
      id: config
      run: |
        # avoid "hardlink different from source"
        git config --global core.commitGraph false
        case ${{ matrix.os }} in
          windows)
            echo target=win-64 >> $GITHUB_OUTPUT
            ;;
          macos)
            echo target=osx-arm64 >> $GITHUB_OUTPUT
            ;;
          *)
            echo target=linux-64 >> $GITHUB_OUTPUT
            ;;
        esac
    - uses: prefix-dev/rattler-build-action@v0.2.39
      with:
        recipe-path: recipe.yaml
        rattler-build-version: v0.76.1
        # --no-build-id: required for ccache
        build-args: >
          --target-platform ${{ steps.config.outputs.target }}
          -c conda-forge
          --no-build-id
        artifact-name: conda-${{ steps.config.outputs.target }}
    - if: failure()
      name: Upload debug build logs
      uses: actions/upload-artifact@v7
      with:
        name: conda-build-logs-${{ matrix.os }}
        path: output/bld
        retention-days: 7
  upload:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-slim
    needs: build
    defaults: {run: {working-directory: output}}
    steps:
    - uses: actions/checkout@v7
    - uses: prefix-dev/rattler-build-action@v0.2.39
      with: {setup-only: true}
    - uses: actions/download-artifact@v8
      with: {pattern: conda-*, path: output, merge-multiple: true}
    - name: conda upload -c synerbi
      run: >
        rattler-build upload anaconda */*.conda -f
        -o synerbi -c ${{ startsWith(github.ref, 'refs/heads/main') && 'main' || 'dev' }}
      env:
        ANACONDA_API_KEY: ${{ secrets.ANACONDA_API_KEY }}
